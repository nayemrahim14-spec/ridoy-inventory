<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>RIDOY INVENTORY</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f8;
  color:#222;
}

.header{
  background:#111;
  color:#fff;
  padding:18px 15px;
  text-align:center;
  font-size:23px;
  font-weight:bold;
}

.container{
  max-width:600px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:14px;
  padding:15px;
  margin-bottom:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

select,
input{
  width:100%;
  padding:13px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:16px;
  background:#fff;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.btn-scan{
  background:#198754;
  color:white;
  font-size:18px;
  margin-top:10px;
}

.btn-close{
  background:#dc3545;
  color:#fff;
  margin-top:10px;
}

.btn-save{
  background:#0d6efd;
  color:#fff;
  margin-top:10px;
}

.btn-secondary{
  background:#6c757d;
  color:#fff;
  margin-top:8px;
}

.status{
  padding:10px;
  border-radius:8px;
  margin-bottom:12px;
  font-size:14px;
  display:none;
}

.status.success{
  display:block;
  background:#d1e7dd;
  color:#0f5132;
}

.status.error{
  display:block;
  background:#f8d7da;
  color:#842029;
}

.status.info{
  display:block;
  background:#cff4fc;
  color:#055160;
}

#reader{
  width:100%;
  overflow:hidden;
  border-radius:12px;
  margin-top:10px;
  display:none;
}

.product{
  margin-top:12px;
  padding:14px;
  border-radius:10px;
  background:#f1f3f5;
  display:none;
}

.product strong{
  display:block;
  font-size:18px;
  margin-bottom:5px;
}

.barcode{
  font-family:monospace;
  font-size:14px;
}

.recent-item{
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.recent-item:last-child{
  border-bottom:0;
}

.recent-title{
  font-weight:bold;
}

.recent-meta{
  font-size:13px;
  color:#666;
  margin-top:4px;
}

.qty-box{
  margin-top:12px;
  display:none;
}

.loading{
  text-align:center;
  padding:20px;
  color:#666;
}

.small{
  font-size:12px;
  color:#777;
}

.hidden{
  display:none!important;
}

.summary-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.stat{
  background:#f1f3f5;
  padding:15px;
  border-radius:10px;
  text-align:center;
}

.stat-number{
  font-size:25px;
  font-weight:bold;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  z-index:9999;
}

.modal-box{
  width:100%;
  max-width:450px;
  background:white;
  border-radius:14px;
  padding:18px;
}

.modal-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:15px;
}
</style>
</head>

<body>

<div class="header">
  RIDOY INVENTORY
</div>

<div class="container">

  <div id="status" class="status"></div>

  <!-- SETTINGS -->
  <div class="card">

    <div class="row">

      <div>
        <label>Location</label>

        <select id="location">
          <option value="">Loading...</option>
        </select>
      </div>

      <div>
        <label>Employee</label>

        <select id="employee">
          <option value="">Loading...</option>
        </select>
      </div>

    </div>

    <div style="margin-top:10px;">
      <label>Date</label>

      <input type="date" id="date">
    </div>

  </div>


  <!-- SCANNER -->
  <div class="card">

    <button
      id="scanBtn"
      class="btn-scan"
      onclick="startScanner()">

      📷 SCAN BARCODE

    </button>

    <div id="reader"></div>

    <button
      id="closeBtn"
      class="btn-close hidden"
      onclick="stopScanner()">

      CLOSE CAMERA

    </button>

  </div>


  <!-- PRODUCT -->
  <div class="card">

    <div id="productBox" class="product">

      <strong id="productName">
        Product
      </strong>

      <div class="barcode">
        Barcode:
        <span id="productBarcode"></span>
      </div>

      <div>
        Product Code:
        <span id="productCode"></span>
      </div>

      <div>
        Price:
        <span id="productPrice"></span>
      </div>

    </div>


    <div id="qtyBox" class="qty-box">

      <label>Quantity</label>

      <input
        id="qty"
        type="number"
        min="1"
        value="1"
        inputmode="numeric">

      <button
        class="btn-save"
        onclick="saveCurrentCount()">

        💾 SAVE COUNT

      </button>

    </div>

  </div>


  <!-- RECENT -->
  <div class="card">

    <h3>Recent Counts</h3>

    <div id="recent">
      <div class="loading">
        No counts yet.
      </div>
    </div>

  </div>


  <!-- SUMMARY -->
  <div class="card">

    <button
      class="btn-secondary"
      onclick="loadSummary()">

      📊 VIEW SUMMARY

    </button>

    <div id="summary" class="hidden">

      <div class="summary-box">

        <div class="stat">
          <div class="stat-number" id="totalProducts">
            0
          </div>
          <div>Products</div>
        </div>

        <div class="stat">
          <div class="stat-number" id="totalQty">
            0
          </div>
          <div>Total Qty</div>
        </div>

      </div>

      <div id="summaryList"
           style="margin-top:12px;">
      </div>

    </div>

  </div>

</div>


<!-- EDIT MODAL -->

<div id="editModal" class="modal">

  <div class="modal-box">

    <div class="modal-title">
      Edit Quantity
    </div>

    <div id="editProduct"
         style="margin-bottom:12px;">
    </div>

    <input
      type="number"
      id="editQty"
      min="1"
      inputmode="numeric">

    <button
      class="btn-save"
      onclick="saveEdit()">

      SAVE EDIT

    </button>

    <button
      class="btn-secondary"
      onclick="closeEdit()">

      CANCEL

    </button>

  </div>

</div>


<script>

/****************************************************
 * CONFIG
 ****************************************************/

const API_URL =
"https://script.google.com/macros/s/AKfycby0IWC0aq2QkCsS54ztJU_NEzryyrs9i6BRQEBou0eHBpQltzg_TQXh7WcXX4QrWH8e0w/exec";


/****************************************************
 * GLOBAL
 ****************************************************/

let products = [];

let currentProduct = null;

let scanner = null;

let scannerRunning = false;

let currentEditId = null;

let recentRecords = [];


/****************************************************
 * DOM
 ****************************************************/

const locationSelect =
document.getElementById("location");

const employeeSelect =
document.getElementById("employee");

const dateInput =
document.getElementById("date");


/****************************************************
 * DATE
 ****************************************************/

function today(){

  const d = new Date();

  const y = d.getFullYear();

  const m =
    String(d.getMonth()+1)
    .padStart(2,"0");

  const day =
    String(d.getDate())
    .padStart(2,"0");

  return `${y}-${m}-${day}`;
}

dateInput.value = today();


/****************************************************
 * STATUS
 ****************************************************/

function showStatus(message,type="info"){

  const el =
    document.getElementById("status");

  el.textContent = message;

  el.className =
    "status " + type;

}


/****************************************************
 * DEVICE ID
 ****************************************************/

function getDeviceId(){

  let id =
    localStorage.getItem("ridoy_device_id");

  if(!id){

    id =
      "DEV-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8);

    localStorage.setItem(
      "ridoy_device_id",
      id
    );

  }

  return id;
}


/****************************************************
 * JSONP API
 ****************************************************/

function api(action,payload={}){

  return new Promise((resolve,reject)=>{

    const callbackName =
      "ridoyCallback_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2,8);

    const script =
      document.createElement("script");

    const callback =
      encodeURIComponent(callbackName);

    const actionParam =
      encodeURIComponent(action);

    const payloadParam =
      encodeURIComponent(
        JSON.stringify(payload)
      );

    const url =
      API_URL +
      "?action=" +
      actionParam +
      "&payload=" +
      payloadParam +
      "&callback=" +
      callback;

    window[callbackName] =
      function(response){

        cleanup();

        if(response && response.ok){

          resolve(response.data);

        }else{

          reject(
            new Error(
              response?.error ||
              "API Error"
            )
          );

        }

      };

    script.onerror =
      function(){

        cleanup();

        reject(
          new Error(
            "API connection failed"
          )
        );

      };

    script.src = url;

    document.body.appendChild(script);


    function cleanup(){

      try{
        script.remove();
      }catch(e){}

      try{
        delete window[callbackName];
      }catch(e){}

    }

  });

}


/****************************************************
 * LOAD INITIAL DATA
 ****************************************************/

async function loadInitialData(){

  showStatus(
    "Loading data...",
    "info"
  );

  try{

    const results =
      await Promise.all([
        api("locations"),
        api("employees"),
        api("products")
      ]);

    const locations =
      results[0];

    const employees =
      results[1];

    products =
      results[2] || [];


    populateLocations(locations);

    populateEmployees(employees);


    // restore previous selection

    const savedLocation =
      localStorage.getItem(
        "ridoy_location"
      );

    const savedEmployee =
      localStorage.getItem(
        "ridoy_employee"
      );


    if(savedLocation &&
       [...locationSelect.options]
       .some(o=>o.value===savedLocation)){

      locationSelect.value =
        savedLocation;

    }


    if(savedEmployee &&
       [...employeeSelect.options]
       .some(o=>o.value===savedEmployee)){

      employeeSelect.value =
        savedEmployee;

    }


    showStatus(
      "System ready.",
      "success"
    );


    loadRecent();

  }catch(err){

    console.error(err);

    showStatus(
      "Data load failed: " +
      err.message,
      "error"
    );

  }

}


/****************************************************
 * LOCATIONS
 ****************************************************/

function populateLocations(list){

  locationSelect.innerHTML =
    '<option value="">Select Location</option>';

  (list || []).forEach(location=>{

    const option =
      document.createElement("option");

    option.value = location;

    option.textContent = location;

    locationSelect.appendChild(
      option
    );

  });

}


/****************************************************
 * EMPLOYEES
 ****************************************************/

function populateEmployees(list){

  employeeSelect.innerHTML =
    '<option value="">Select Employee</option>';

  (list || []).forEach(emp=>{

    const option =
      document.createElement("option");

    option.value = emp.name;

    option.textContent =
      emp.name;

    employeeSelect.appendChild(
      option
    );

  });

}


/****************************************************
 * SAVE SETTINGS
 ****************************************************/

locationSelect.addEventListener(
  "change",
  ()=>{

    localStorage.setItem(
      "ridoy_location",
      locationSelect.value
    );

    loadRecent();

  }
);


employeeSelect.addEventListener(
  "change",
  ()=>{

    localStorage.setItem(
      "ridoy_employee",
      employeeSelect.value
    );

    loadRecent();

  }
);


dateInput.addEventListener(
  "change",
  loadRecent
);


/****************************************************
 * START SCANNER
 ****************************************************/

async function startScanner(){

  if(scannerRunning)
    return;

  if(!locationSelect.value){

    showStatus(
      "Please select Location first.",
      "error"
    );

    return;
  }

  if(!employeeSelect.value){

    showStatus(
      "Please select Employee first.",
      "error"
    );

    return;
  }


  document.getElementById(
    "reader"
  ).style.display = "block";

  document.getElementById(
    "closeBtn"
  ).classList.remove("hidden");


  scanner =
    new Html5Qrcode("reader");


  try{

    await scanner.start(

      {
        facingMode:"environment"
      },

      {
        fps:15,

        qrbox:function(
          viewfinderWidth,
          viewfinderHeight
        ){

          const size =
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * 0.75;

          return {
            width:size,
            height:size
          };

        },

        formatsToSupport:[
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E,
          Html5QrcodeSupportedFormats.ITF
        ]

      },

      onScanSuccess,

      ()=>{}

    );


    scannerRunning = true;

    showStatus(
      "Camera ready. Scan barcode.",
      "success"
    );


  }catch(err){

    console.error(err);

    showStatus(
      "Camera could not be opened. " +
      err.message,
      "error"
    );

    stopScanner();

  }

}


/****************************************************
 * STOP SCANNER
 ****************************************************/

async function stopScanner(){

  if(scanner){

    try{

      if(scannerRunning){

        await scanner.stop();

      }

    }catch(e){}

    try{

      await scanner.clear();

    }catch(e){}

  }

  scanner = null;

  scannerRunning = false;


  document.getElementById(
    "reader"
  ).style.display = "none";


  document.getElementById(
    "closeBtn"
  ).classList.add("hidden");

}


/****************************************************
 * BARCODE SUCCESS
 ****************************************************/

let lastScannedBarcode = "";

let lastScanTime = 0;


async function onScanSuccess(decodedText){

  const barcode =
    String(decodedText || "").trim();


  if(!barcode)
    return;


  const now =
    Date.now();


  // Prevent double scan

  if(
    barcode === lastScannedBarcode &&
    now - lastScanTime < 1500
  ){

    return;

  }


  lastScannedBarcode = barcode;

  lastScanTime = now;


  await stopScanner();


  showStatus(
    "Barcode: " + barcode +
    " — finding product...",
    "info"
  );


  findProduct(barcode);

}


/****************************************************
 * PRODUCT SEARCH
 ****************************************************/

async function findProduct(barcode){

  let product =
    products.find(
      p =>
        String(p.barcode).trim() ===
        String(barcode).trim()
    );


  // If local cache doesn't find,
  // ask server directly.

  if(!product){

    try{

      product =
        await api(
          "product",
          {barcode:barcode}
        );

    }catch(err){

      console.error(err);

    }

  }


  if(!product){

    currentProduct = null;

    document.getElementById(
      "productBox"
    ).style.display = "none";

    document.getElementById(
      "qtyBox"
    ).style.display = "none";


    showStatus(
      "Product not found for barcode: " +
      barcode,
      "error"
    );

    return;

  }


  currentProduct = product;


  document.getElementById(
    "productName"
  ).textContent =
    product.description ||
    "Unknown Product";


  document.getElementById(
    "productBarcode"
  ).textContent =
    product.barcode || barcode;


  document.getElementById(
    "productCode"
  ).textContent =
    product.productCode || "-";


  document.getElementById(
    "productPrice"
  ).textContent =
    product.price || 0;


  document.getElementById(
    "productBox"
  ).style.display = "block";


  document.getElementById(
    "qtyBox"
  ).style.display = "block";


  document.getElementById(
    "qty"
  ).value = 1;


  document.getElementById(
    "qty"
  ).focus();


  showStatus(
    "Product found. Enter quantity.",
    "success"
  );

}


/****************************************************
 * SAVE COUNT
 ****************************************************/

async function saveCurrentCount(){

  if(!currentProduct){

    showStatus(
      "No product selected.",
      "error"
    );

    return;

  }


  const qty =
    Number(
      document.getElementById(
        "qty"
      ).value
    );


  if(!qty || qty <= 0){

    showStatus(
      "Enter a valid quantity.",
      "error"
    );

    return;

  }


  const payload = {

    barcode:
      currentProduct.barcode,

    qty:qty,

    location:
      locationSelect.value,

    employee:
      employeeSelect.value,

    date:
      dateInput.value,

    clientId:
      "CLI-" +
      Date.now() +
      "-" +
      Math.random()
        .toString(36)
        .substring(2,8),

    deviceId:
      getDeviceId()

  };


  try{

    showStatus(
      "Saving...",
      "info"
    );


    const result =
      await api(
        "save",
        payload
      );


    if(result && result.ok){

      showStatus(
        "Saved successfully.",
        "success"
      );


      currentProduct = null;


      document.getElementById(
        "productBox"
      ).style.display = "none";


      document.getElementById(
        "qtyBox"
      ).style.display = "none";


      loadRecent();

      // Ready for next scan
      setTimeout(
        startScanner,
        250
      );

    }else{

      throw new Error(
        result?.error ||
        "Save failed"
      );

    }


  }catch(err){

    console.error(err);

    showStatus(
      "Save failed: " +
      err.message,
      "error"
    );

  }

}


/****************************************************
 * RECENT RECORDS
 ****************************************************/

async function loadRecent(){

  if(
    !locationSelect.value ||
    !employeeSelect.value
  ){

    return;

  }


  try{

    const records =
      await api(
        "records",
        {
          date:
            dateInput.value,

          location:
            locationSelect.value,

          employee:
            employeeSelect.value
        }
      );


    recentRecords =
      records || [];


    renderRecent();


  }catch(err){

    console.error(err);

  }

}


/****************************************************
 * RENDER RECENT
 ****************************************************/

function renderRecent(){

  const box =
    document.getElementById(
      "recent"
    );


  if(!recentRecords.length){

    box.innerHTML =
      '<div class="loading">' +
      'No counts yet.' +
      '</div>';

    return;

  }


  box.innerHTML =
    recentRecords
      .slice(0,20)
      .map(r=>`

        <div class="recent-item">

          <div class="recent-title">
            ${escapeHtml(
              r.description ||
              "Unknown Product"
            )}
          </div>

          <div class="recent-meta">
            Barcode:
            ${escapeHtml(r.barcode)}
          </div>

          <div class="recent-meta">
            Qty:
            <strong>${r.qty}</strong>
          </div>

          <div class="recent-meta">
            ${escapeHtml(
              r.employee
            )}
            —
            ${escapeHtml(
              r.location
            )}
          </div>

          <button
            class="btn-secondary"
            style="margin-top:7px;padding:9px;"
            onclick="openEdit(
              '${escapeAttr(r.recordId)}'
            )">

            ✏️ EDIT

          </button>

        </div>

      `)
      .join("");

}


/****************************************************
 * EDIT
 ****************************************************/

function openEdit(recordId){

  const record =
    recentRecords.find(
      r =>
        r.recordId === recordId
    );


  if(!record)
    return;


  currentEditId =
    record.recordId;


  document.getElementById(
    "editProduct"
  ).innerHTML =
    "<strong>" +
    escapeHtml(
      record.description
    ) +
    "</strong><br>" +
    "Barcode: " +
    escapeHtml(
      record.barcode
    );


  document.getElementById(
    "editQty"
  ).value =
    record.qty;


  document.getElementById(
    "editModal"
  ).style.display =
    "flex";

}


function closeEdit(){

  currentEditId = null;

  document.getElementById(
    "editModal"
  ).style.display =
    "none";

}


async function saveEdit(){

  if(!currentEditId)
    return;


  const qty =
    Number(
      document.getElementById(
        "editQty"
      ).value
    );


  if(!qty || qty <= 0){

    showStatus(
      "Invalid quantity.",
      "error"
    );

    return;

  }


  try{

    const result =
      await api(
        "edit",
        {
          recordId:
            currentEditId,

          qty:qty,

          employee:
            employeeSelect.value,

          deviceId:
            getDeviceId()
        }
      );


    if(!result || !result.ok){

      throw new Error(
        result?.error ||
        "Edit failed"
      );

    }


    closeEdit();


    showStatus(
      "Quantity updated.",
      "success"
    );


    loadRecent();


  }catch(err){

    showStatus(
      "Edit failed: " +
      err.message,
      "error"
    );

  }

}


/****************************************************
 * SUMMARY
 ****************************************************/

async function loadSummary(){

  if(
    !locationSelect.value ||
    !employeeSelect.value
  ){

    showStatus(
      "Select Location and Employee first.",
      "error"
    );

    return;

  }


  try{

    const summary =
      await api(
        "summary",
        {
          date:
            dateInput.value,

          location:
            locationSelect.value,

          employee:
            employeeSelect.value
        }
      );


    const list =
      summary || [];


    document.getElementById(
      "summary"
    ).classList.remove(
      "hidden"
    );


    document.getElementById(
      "totalProducts"
    ).textContent =
      list.length;


    const total =
      list.reduce(
        (sum,r)=>
          sum +
          Number(r.qty || 0),
        0
      );


    document.getElementById(
      "totalQty"
    ).textContent =
      total;


    document.getElementById(
      "summaryList"
    ).innerHTML =
      list.map(r=>`

        <div class="recent-item">

          <strong>
            ${escapeHtml(
              r.description
            )}
          </strong>

          <div class="recent-meta">
            ${escapeHtml(
              r.barcode
            )}
          </div>

          <div class="recent-meta">
            Quantity:
            <strong>
              ${r.qty}
            </strong>
          </div>

        </div>

      `).join("");


  }catch(err){

    showStatus(
      "Summary failed: " +
      err.message,
      "error"
    );

  }

}


/****************************************************
 * SECURITY / HTML
 ****************************************************/

function escapeHtml(value){

  return String(value ?? "")
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttr(value){

  return String(value ?? "")
    .replace(
      /'/g,
      "\\'"
    );

}


/****************************************************
 * ENTER = SAVE
 ****************************************************/

document.getElementById(
  "qty"
).addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      saveCurrentCount();

    }

  }
);


/****************************************************
 * START
 ****************************************************/

window.addEventListener(
  "load",
  loadInitialData
);

</script>
