<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>RIDOY INVENTORY</title>

  <!-- Barcode Scanner -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f3f5f7;
      color: #17202a;
    }

    body {
      padding-bottom: 30px;
    }

    button,
    input,
    select {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }


    /* ==============================
       HEADER
       ============================== */

    .header {
      background:
        linear-gradient(
          135deg,
          #111827,
          #1f2937
        );

      color: white;

      padding:
        18px
        16px
        16px;

      box-shadow:
        0 3px 12px
        rgba(0,0,0,.18);

      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .5px;
    }

    .header-subtitle {
      margin-top: 4px;
      font-size: 12px;
      opacity: .72;
    }


    /* ==============================
       CONNECTION STATUS
       ============================== */

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 8px 14px;

      background: white;

      border-bottom:
        1px solid #e5e7eb;

      font-size: 12px;
    }

    .status-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #22c55e;
    }

    .status-dot.offline {
      background: #ef4444;
    }

    .queue-count {
      background: #f59e0b;
      color: white;
      padding: 3px 8px;
      border-radius: 20px;
      font-weight: 700;
      display: none;
    }


    /* ==============================
       MAIN
       ============================== */

    .container {
      width: 100%;
      max-width: 650px;
      margin: auto;
      padding: 12px;
    }


    /* ==============================
       INFO CARD
       ============================== */

    .info-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      box-shadow:
        0 2px 10px
        rgba(0,0,0,.07);

      margin-bottom: 12px;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .info-box {
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px;
    }

    .info-label {
      color: #6b7280;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .info-value {
      font-weight: 700;
      font-size: 14px;
      word-break: break-word;
    }

    .change-btn {
      margin-top: 10px;
      width: 100%;
      border: 0;
      background: #eef2ff;
      color: #3730a3;
      padding: 11px;
      border-radius: 9px;
      font-weight: 700;
    }


    /* ==============================
       SCANNER CARD
       ============================== */

    .scanner-card {
      background: white;
      border-radius: 14px;
      padding: 12px;
      box-shadow:
        0 2px 10px
        rgba(0,0,0,.07);

      margin-bottom: 12px;
    }

    #reader {
      width: 100%;
      display: none;
      overflow: hidden;
      border-radius: 12px;
      background: #000;
    }

    #reader video {
      width: 100% !important;
      border-radius: 12px;
    }

    .scan-btn {
      width: 100%;
      border: 0;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #16a34a,
          #15803d
        );

      color: white;

      padding: 17px;

      font-size: 17px;
      font-weight: 800;

      box-shadow:
        0 4px 10px
        rgba(22,163,74,.25);
    }

    .scan-btn:active {
      transform: scale(.98);
    }

    .close-camera {
      width: 100%;
      border: 0;
      background: #fee2e2;
      color: #b91c1c;
      padding: 12px;
      margin-top: 8px;
      border-radius: 10px;
      font-weight: 700;
      display: none;
    }


    /* ==============================
       SCAN RESULT
       ============================== */

    .product-card {
      display: none;

      background: #f0fdf4;
      border: 1px solid #bbf7d0;

      border-radius: 12px;

      padding: 13px;

      margin-top: 10px;
    }

    .product-title {
      font-size: 16px;
      font-weight: 800;
      color: #166534;
    }

    .product-code {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }

    .barcode-text {
      font-size: 12px;
      color: #475569;
      margin-top: 4px;
    }


    /* ==============================
       QUANTITY
       ============================== */

    .qty-section {
      display: none;
      margin-top: 12px;
    }

    .qty-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .qty-row {
      display: flex;
      gap: 8px;
    }

    #qtyInput {
      flex: 1;

      border:
        2px solid #d1d5db;

      border-radius: 10px;

      padding: 14px;

      font-size: 20px;
      font-weight: 800;

      text-align: center;

      outline: none;
    }

    #qtyInput:focus {
      border-color: #2563eb;
    }

    .save-btn {
      min-width: 115px;

      border: 0;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      font-size: 15px;
      font-weight: 800;
    }


    /* ==============================
       RECENT COUNTS
       ============================== */

    .section-card {
      background: white;
      border-radius: 14px;
      padding: 13px;

      box-shadow:
        0 2px 10px
        rgba(0,0,0,.07);

      margin-bottom: 12px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 10px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .recent-item {
      border:
        1px solid #e5e7eb;

      border-radius: 10px;

      padding: 10px;

      background: #fafafa;
    }

    .recent-main {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .recent-name {
      font-size: 14px;
      font-weight: 700;
    }

    .recent-code {
      font-size: 11px;
      color: #64748b;
      margin-top: 3px;
    }

    .recent-qty {
      font-size: 18px;
      font-weight: 900;
      color: #166534;
      white-space: nowrap;
    }

    .recent-meta {
      display: flex;
      justify-content: space-between;

      margin-top: 7px;

      font-size: 10px;
      color: #64748b;
    }

    .edit-btn {
      border: 0;
      background: #e0e7ff;
      color: #3730a3;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }


    /* ==============================
       SUMMARY
       ============================== */

    .summary-btn {
      width: 100%;

      border: 0;

      border-radius: 10px;

      background: #111827;

      color: white;

      padding: 13px;

      font-weight: 800;

      margin-top: 8px;
    }

    .summary-panel {
      display: none;

      margin-top: 10px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;

      padding: 9px 0;

      border-bottom:
        1px solid #e5e7eb;
    }

    .summary-name {
      font-size: 13px;
      font-weight: 700;
    }

    .summary-qty {
      font-weight: 900;
    }


    /* ==============================
       MODAL
       ============================== */

    .modal {
      position: fixed;
      inset: 0;

      background:
        rgba(0,0,0,.55);

      display: none;

      align-items: center;
      justify-content: center;

      z-index: 999;
    }

    .modal-box {
      width: calc(100% - 28px);
      max-width: 430px;

      background: white;

      border-radius: 16px;

      padding: 18px;

      box-shadow:
        0 15px 50px
        rgba(0,0,0,.25);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: #64748b;
      margin-bottom: 5px;
    }

    .field select,
    .field input {
      width: 100%;

      padding: 12px;

      border:
        1px solid #d1d5db;

      border-radius: 9px;

      font-size: 14px;

      background: white;
    }

    .modal-buttons {
      display: flex;
      gap: 8px;
      margin-top: 15px;
    }

    .modal-buttons button {
      flex: 1;

      border: 0;

      padding: 12px;

      border-radius: 9px;

      font-weight: 800;
    }

    .cancel-btn {
      background: #e5e7eb;
      color: #374151;
    }

    .apply-btn {
      background: #2563eb;
      color: white;
    }


    /* ==============================
       TOAST
       ============================== */

    #toast {
      position: fixed;

      left: 50%;
      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(100px);

      background: #111827;

      color: white;

      padding: 12px 17px;

      border-radius: 10px;

      font-size: 13px;

      font-weight: 700;

      z-index: 2000;

      opacity: 0;

      transition: .25s;

      max-width: 90%;

      text-align: center;
    }

    #toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }


    /* ==============================
       LOADING
       ============================== */

    .loading {
      display: none;

      position: fixed;

      inset: 0;

      background:
        rgba(255,255,255,.7);

      z-index: 1500;

      align-items: center;
      justify-content: center;
    }

    .loading-box {
      background: white;

      padding: 20px 25px;

      border-radius: 12px;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.15);

      font-weight: 700;
    }


    /* ==============================
       EMPTY
       ============================== */

    .empty {
      text-align: center;

      padding: 20px;

      color: #94a3b8;

      font-size: 13px;
    }


    /* ==============================
       RESPONSIVE
       ============================== */

    @media (max-width: 420px) {

      .info-grid {
        grid-template-columns: 1fr 1fr;
      }

      .header-title {
        font-size: 20px;
      }

      .scan-btn {
        padding: 16px;
      }
    }

  </style>
</head>


<body>


  <!-- ==========================================
       HEADER
       ========================================== -->

  <div class="header">

    <div class="header-title">
      RIDOY INVENTORY
    </div>

    <div class="header-subtitle">
      Fast Barcode Stock Counting System
    </div>

  </div>


  <!-- ==========================================
       CONNECTION STATUS
       ========================================== -->

  <div class="status-bar">

    <div class="status-left">

      <span
        id="statusDot"
        class="status-dot"
      ></span>

      <span id="statusText">
        Checking connection...
      </span>

    </div>


    <span
      id="queueCount"
      class="queue-count"
    >
      0 pending
    </span>

  </div>


  <!-- ==========================================
       MAIN
       ========================================== -->

  <div class="container">


    <!-- ========================================
         INFO
         ======================================== -->

    <div class="info-card">

      <div class="info-grid">

        <div class="info-box">

          <div class="info-label">
            LOCATION
          </div>

          <div
            id="locationDisplay"
            class="info-value"
          >
            Loading...
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            EMPLOYEE
          </div>

          <div
            id="employeeDisplay"
            class="info-value"
          >
            Loading...
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            DATE
          </div>

          <div
            id="dateDisplay"
            class="info-value"
          >
            -
          </div>

        </div>


        <div class="info-box">

          <div class="info-label">
            TOTAL COUNT
          </div>

          <div
            id="totalQtyDisplay"
            class="info-value"
          >
            0
          </div>

        </div>

      </div>


      <button
        class="change-btn"
        onclick="openSettings()"
      >
        ⚙️ Change Location / Employee
      </button>

    </div>


    <!-- ========================================
         SCANNER
         ======================================== -->

    <div class="scanner-card">


      <button
        id="scanButton"
        class="scan-btn"
        onclick="startScanner()"
      >
        📷 SCAN BARCODE
      </button>


      <div id="reader"></div>


      <button
        id="closeCameraButton"
        class="close-camera"
        onclick="stopScanner()"
      >
        ✕ CLOSE CAMERA
      </button>


      <!-- PRODUCT RESULT -->

      <div
        id="productCard"
        class="product-card"
      >

        <div
          id="productTitle"
          class="product-title"
        >
          Product
        </div>

        <div
          id="productCode"
          class="product-code"
        >
          Product Code
        </div>

        <div
          id="barcodeText"
          class="barcode-text"
        >
          Barcode
        </div>

      </div>


      <!-- QUANTITY -->

      <div
        id="qtySection"
        class="qty-section"
      >

        <div class="qty-label">
          Enter Quantity
        </div>

        <div class="qty-row">

          <input
            id="qtyInput"
            type="number"
            min="1"
            step="1"
            value="1"
            inputmode="numeric"
            placeholder="Qty"
          >

          <button
            class="save-btn"
            onclick="saveCurrentCount()"
          >
            SAVE
          </button>

        </div>

      </div>

    </div>


    <!-- ========================================
         RECENT COUNTS
         ======================================== -->

    <div class="section-card">

      <div class="section-title">

        <span>
          Recent Counts
        </span>

        <span
          id="recentCountNumber"
          style="
            color:#64748b;
            font-size:12px;
          "
        >
          0
        </span>

      </div>


      <div
        id="recentList"
        class="recent-list"
      >

        <div class="empty">
          No counts yet.
        </div>

      </div>


      <button
        class="summary-btn"
        onclick="toggleSummary()"
      >
        📊 VIEW SUMMARY
      </button>


      <div
        id="summaryPanel"
        class="summary-panel"
      >

        <div
          id="summaryList"
        ></div>

      </div>

    </div>


  </div>


  <!-- ==========================================
       SETTINGS MODAL
       ========================================== -->

  <div
    id="settingsModal"
    class="modal"
  >

    <div class="modal-box">

      <div class="modal-title">
        Inventory Settings
      </div>


      <div class="field">

        <label>
          Location
        </label>

        <select id="locationSelect">

          <option value="">
            Select Location
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Employee
        </label>

        <select id="employeeSelect">

          <option value="">
            Select Employee
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Date
        </label>

        <input
          id="dateInput"
          type="date"
        >

      </div>


      <div class="modal-buttons">

        <button
          class="cancel-btn"
          onclick="closeSettings()"
        >
          CANCEL
        </button>

        <button
          class="apply-btn"
          onclick="applySettings()"
        >
          SAVE
        </button>

      </div>

    </div>

  </div>


  <!-- ==========================================
       EDIT MODAL
       ========================================== -->

  <div
    id="editModal"
    class="modal"
  >

    <div class="modal-box">

      <div class="modal-title">
        Edit Quantity
      </div>


      <div
        id="editProductName"
        style="
          font-weight:700;
          margin-bottom:12px;
        "
      >
        Product
      </div>


      <div class="field">

        <label>
          New Quantity
        </label>

        <input
          id="editQtyInput"
          type="number"
          min="1"
          step="1"
          inputmode="numeric"
        >

      </div>


      <div class="modal-buttons">

        <button
          class="cancel-btn"
          onclick="closeEditModal()"
        >
          CANCEL
        </button>

        <button
          class="apply-btn"
          onclick="saveEdit()"
        >
          UPDATE
        </button>

      </div>

    </div>

  </div>


  <!-- ==========================================
       LOADING
       ========================================== -->

  <div
    id="loading"
    class="loading"
  >

    <div class="loading-box">
      Please wait...
    </div>

  </div>


  <!-- ==========================================
       TOAST
       ========================================== -->

  <div id="toast"></div>


<script>


/********************************************************
 * IMPORTANT
 *
 * এখানে আপনার Apps Script Web App URL বসাবেন।
 *
 * Example:
 *
 * https://script.google.com/macros/s/XXXXXXXX/exec
 ********************************************************/

const API_URL =
  "https://script.google.com/macros/s/AKfycby0IWC0aq2QkCsS54ztJU_NEzryyrs9i6BRQEBou0eHBpQltzg_TQXh7WcXX4QrWH8e0w/exec";


/********************************************************
 * APP STATE
 ********************************************************/

let scanner = null;

let scannerRunning = false;

let currentBarcode = "";

let currentProduct = null;

let records = [];

let products = [];

let employees = [];

let locations = [];

let editingRecordId = null;

let saving = false;


/********************************************************
 * LOCAL STORAGE KEYS
 ********************************************************/

const STORAGE = {

  location:
    "ridoy_inventory_location",

  employee:
    "ridoy_inventory_employee",

  date:
    "ridoy_inventory_date",

  queue:
    "ridoy_inventory_queue",

  device:
    "ridoy_inventory_device"

};


/********************************************************
 * DEVICE ID
 ********************************************************/

function getDeviceId() {

  let id =
    localStorage.getItem(
      STORAGE.device
    );

  if (!id) {

    id =
      "DEV_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 8);

    localStorage.setItem(
      STORAGE.device,
      id
    );
  }

  return id;
}


/********************************************************
 * TODAY
 ********************************************************/

function todayKey() {

  const d = new Date();

  const y =
    d.getFullYear();

  const m =
    String(d.getMonth() + 1)
      .padStart(2, "0");

  const day =
    String(d.getDate())
      .padStart(2, "0");

  return `${y}-${m}-${day}`;
}


/********************************************************
 * INITIALIZATION
 ********************************************************/

document.addEventListener(
  "DOMContentLoaded",
  async function() {

    document
      .getElementById("dateInput")
      .value =
      localStorage.getItem(
        STORAGE.date
      ) || todayKey();


    loadLocalSettings();

    updateConnectionStatus();

    updateQueueDisplay();

    await loadMasterData();

    await loadRecords();

    startAutoSync();

    setInterval(
      updateConnectionStatus,
      5000
    );

    setInterval(
      flushQueue,
      5000
    );

  }
);


/********************************************************
 * LOAD SETTINGS
 ********************************************************/

function loadLocalSettings() {

  const location =
    localStorage.getItem(
      STORAGE.location
    );

  const employee =
    localStorage.getItem(
      STORAGE.employee
    );

  const date =
    localStorage.getItem(
      STORAGE.date
    ) || todayKey();


  if (location) {

    document
      .getElementById(
        "locationDisplay"
      )
      .textContent =
      location;
  }
  else {

    document
      .getElementById(
        "locationDisplay"
      )
      .textContent =
      "Not selected";
  }


  if (employee) {

    document
      .getElementById(
        "employeeDisplay"
      )
      .textContent =
      employee;
  }
  else {

    document
      .getElementById(
        "employeeDisplay"
      )
      .textContent =
      "Not selected";
  }


  document
    .getElementById(
      "dateDisplay"
    )
    .textContent =
    date;

}


/********************************************************
 * LOAD MASTER DATA
 ********************************************************/

async function loadMasterData() {

  try {

    showLoading(true);


    const [
      productData,
      employeeData,
      locationData
    ] =
      await Promise.all([

        apiGet(
          "products"
        ),

        apiGet(
          "employees"
        ),

        apiGet(
          "locations"
        )

      ]);


    products =
      Array.isArray(productData)
        ? productData
        : [];


    employees =
      Array.isArray(employeeData)
        ? employeeData
        : [];


    locations =
      Array.isArray(locationData)
        ? locationData
        : [];


    populateSettings();


    showLoading(false);


  } catch (err) {

    showLoading(false);

    console.error(err);

    showToast(
      "Master data load হয়নি। Internet/API check করুন।"
    );

  }

}


/********************************************************
 * POPULATE SETTINGS
 ********************************************************/

function populateSettings() {

  const locationSelect =
    document.getElementById(
      "locationSelect"
    );

  const employeeSelect =
    document.getElementById(
      "employeeSelect"
    );


  locationSelect.innerHTML =
    '<option value="">Select Location</option>';


  locations.forEach(
    function(location) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        location;

      option.textContent =
        location;

      locationSelect.appendChild(
        option
      );

    }
  );


  employeeSelect.innerHTML =
    '<option value="">Select Employee</option>';


  employees.forEach(
    function(employee) {

      const option =
        document.createElement(
          "option"
        );

      option.value =
        employee.name;

      option.textContent =
        employee.name;

      employeeSelect.appendChild(
        option
      );

    }
  );


  const savedLocation =
    localStorage.getItem(
      STORAGE.location
    );

  const savedEmployee =
    localStorage.getItem(
      STORAGE.employee
    );

  const savedDate =
    localStorage.getItem(
      STORAGE.date
    ) || todayKey();


  if (savedLocation) {

    locationSelect.value =
      savedLocation;

/********************************************************
 * API GET
 *
 * JSONP style request
 ********************************************************/

function apiGet(
  action,
  payload = {}
) {

  return new Promise(
    function(resolve, reject) {

      const callbackName =
        "jsonp_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .substring(2, 7);


      const script =
        document.createElement(
          "script"
        );


      const timer =
        setTimeout(
          function() {

            cleanup();

            reject(
              new Error(
                "API timeout"
              )
            );

          },
          15000
        );


      window[callbackName] =
        function(result) {

          clearTimeout(timer);

          cleanup();


          if (
            result &&
            result.ok === true
          ) {

            resolve(
              result.data
            );

          }
          else {

            reject(
              new Error(
                result?.error ||
                "API Error"
              )
            );

          }

        };


      function cleanup() {

        delete window[
          callbackName
        ];

        if (script.parentNode) {

          script.parentNode.removeChild(
            script
          );

        }

      }


      const params =
        new URLSearchParams();


      params.set(
        "action",
        action
      );


      params.set(
        "payload",
        JSON.stringify(
          payload
        )
      );


      /*
       * JSONP callback
       */

      params.set(
        "callback",
        callbackName
      );


      script.src =
        API_URL +
        "?" +
        params.toString();


      script.onerror =
        function() {

          clearTimeout(timer);

          cleanup();

          reject(
            new Error(
              "Network error"
            )
          );

        };


      document.body.appendChild(
        script
      );

    }
  );

}


/********************************************************
 * NOTE
 *
 * Apps Script backend currently returns JSON,
 * not traditional JSONP.
 *
 * Therefore direct API requests are handled below
 * with a normal script request fallback.
 ********************************************************/


async function apiRequest(
  action,
  payload = {}
) {

  try {

    const url =
      API_URL +
      "?action=" +
      encodeURIComponent(
        action
      ) +
      "&payload=" +
      encodeURIComponent(
        JSON.stringify(
          payload
        )
      );


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    const result =
      await response.json();


    if (!result.ok) {

      throw new Error(
        result.error ||
        "API error"
      );
    }


    return result.data;

  } catch (err) {

    throw err;

  }

}


/********************************************************
 * REPLACE apiGet WITH apiRequest
 ********************************************************/

apiGet = apiRequest;

 * SCANNER
 ********************************************************/

async function startScanner() {

  if (scannerRunning) {

    return;
  }


  if (
    !API_URL ||
    API_URL.includes(
      "PASTE_YOUR"
    )
  ) {

    showToast(
      "আগে API_URL-এ Apps Script Web App URL দিন"
    );

    return;
  }


  try {

    currentBarcode = "";

    currentProduct = null;


    hideProduct();


    document
      .getElementById(
        "reader"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "scanButton"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "closeCameraButton"
      )
      .style.display =
      "block";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 15,

      qrbox: function(
        viewfinderWidth,
        viewfinderHeight
      ) {

        const size =
          Math.floor(
            Math.min(
              viewfinderWidth,
              viewfinderHeight
            ) * .72
          );

        return {
          width: size,
          height: size
        };

      },

      aspectRatio:
        1.7777778,

      disableFlip: false

    };


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      onBarcodeDetected,

      function(errorMessage) {

        /*
         * Normal scanner noise.
         * এখানে কোনো error দেখানো হবে না।
         */

      }

    );


    scannerRunning = true;


  } catch (err) {

    console.error(err);

    showToast(
      "Camera open হয়নি। Chrome camera permission এবং HTTPS check করুন।"
    );


    document
      .getElementById(
        "reader"
      )
      .style.display =
      "none";


    document
      .getElementById(
        "scanButton"
      )
      .style.display =
      "block";


    document
      .getElementById(
        "closeCameraButton"
      )
      .style.display =
      "none";

  }

}


/********************************************************
 * BARCODE DETECTED
 ********************************************************/

let processingScan = false;


async function onBarcodeDetected(
  decodedText,
  decodedResult
) {

  if (processingScan) {

    return;
  }


  if (!decodedText) {

    return;
  }


  processingScan = true;


  try {

    /*
     * Stop duplicate frames
     */

    if (scanner) {

      try {

        scanner.pause(
          true
        );

      } catch (e) {}

    }


    currentBarcode =
      String(
        decodedText
      ).trim();


    /*
     * Find product from local cache first
     */

    let product =
      findLocalProduct(
        currentBarcode
      );


    /*
     * If not found,
     * ask server
     */

    if (!product) {

      try {

        product =
          await apiGet(
            "product",
            {
              barcode:
                currentBarcode
            }
          );

      } catch (err) {

        console.error(err);

      }

    }


    if (!product) {

      showToast(
        "Product পাওয়া যায়নি: " +
        currentBarcode
      );


      resumeScanner();

      return;
    }


    currentProduct =
      product;


    showProduct(
      product
    );


    /*
     * Default quantity 1
     */

    document
      .getElementById(
        "qtyInput"
      )
      .value =
      "1";


    document
      .getElementById(
        "qtySection"
      )
      .style.display =
      "block";


    setTimeout(
      function() {

        document
          .getElementById(
            "qtyInput"
          )
          .focus();

        document
          .getElementById(
            "qtyInput"
          )
          .select();

      },
      100
    );


  } catch (err) {

    console.error(err);

    showToast(
      "Scan processing error"
    );

    resumeScanner();

  } finally {

    processingScan = false;

  }

}

  if (!employee) {

    showToast(

  }


  if (
    !currentBarcode ||
    !currentProduct

    return;
  }


  if (
    !qty ||

    return;
  }


  const item = {

    clientId:
      "CLI_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 9),

    deviceId:
      getDeviceId(),

    barcode:
      currentBarcode,

    qty:
      qty,

    location:
      location,

    employee:
      employee,

    date:
      date,

    createdAt:
      Date.now()

  };


  /*
   * IMPORTANT:
   *
   * প্রথমে phone-এর queue-তে save হবে।
   * তারপর server-এ পাঠানো হবে।
   *
   * তাই network problem হলেও
   * scan data immediately হারাবে না।
   */

  addToQueue(
    item
  );


  /*
   * UI update immediately
   */

  const localRecord = {

    recordId:
      item.clientId,

    timestamp:
      new Date(),

    date:
      item.date,

    location:
      item.location,

    employee:
      item.employee,

    barcode:
      item.barcode,

    productCode:
      currentProduct.productCode,

    description:
      currentProduct.description,

    price:
      currentProduct.price,

    qty:
      item.qty,

    pending:
      true

  };


  records.unshift(
    localRecord
  );


  renderRecords();

  updateStats();


  showToast(
    "✓ Saved"
  );


  /*
   * Reset current product
   */

  currentBarcode = "";

  currentProduct = null;

  hideProduct();


  document
    .getElementById(
      "qtyInput"
    )
    .value =
    "1";


  /*
   * Camera immediately ready
   */

  resumeScanner();


  /*
   * Background sync
   */

  flushQueue();

}

/********************************************************
 * QUEUE
 ********************************************************/

function getQueue() {

  try {

    return JSON.parse(
      localStorage.getItem(
        STORAGE.queue
      ) || "[]"
    );

  } catch (e) {

    return [];

  }

}


function saveQueue(
  queue
) {

  localStorage.setItem(
    STORAGE.queue,
    JSON.stringify(
      queue
    )
  );

  updateQueueDisplay();

}


function addToQueue(
  item
) {

  const queue =
    getQueue();

  queue.push(
    item
  );

  saveQueue(
    queue
  );

}


/********************************************************
 * FLUSH QUEUE
 ********************************************************/

let syncing = false;


async function flushQueue() {

  if (syncing) {

    return;
  }


  if (!navigator.onLine) {

    return;
  }


  const queue =
    getQueue();


  if (!queue.length) {

    return;
  }


  syncing = true;


  try {

    while (
      queue.length &&
      navigator.onLine
    ) {

      const item =
        queue[0];


      try {

        const result =
          await apiGet(
            "save",
            item
          );


        if (
          result &&
          result.ok !== false
        ) {

          queue.shift();

          saveQueue(
            queue
          );

        }
        else {

          break;
        }


      } catch (err) {

        console.error(
          "Sync failed",
          err
        );

        break;

      }

    }


  } finally {

    syncing = false;

  }

}

 * QUEUE DISPLAY
 ********************************************************/

function updateQueueDisplay() {

  const count =
    getQueue().length;


  const el =
    document.getElementById(

  if (count > 0) {

    el.style.display =

    el.textContent =

  } else {

  }

}


/********************************************************
 * LOAD RECORDS
 ********************************************************/

async function loadRecords() {

  try {

    const location =
      localStorage.getItem(
        STORAGE.location
      ) || "";


    const employee =
      localStorage.getItem(
        STORAGE.employee
      ) || "";


    const date =
      localStorage.getItem(
        STORAGE.date
      ) || todayKey();


    const result =
      await apiGet(
        "records",
        {
          location:
            location,

          employee:
            employee,

          date:
            date
        }
      );


    records =
      Array.isArray(result)
        ? result
        : [];


    /*
     * Add pending local queue items
     */

    const queue =
      getQueue();


    queue
      .filter(
        function(item) {

          return (
            item.date === date &&
            (!location ||
              item.location === location) &&
            (!employee ||
              item.employee === employee)
          );

        }
      )
      .forEach(
        function(item) {

          const exists =
            records.some(
              function(r) {

                return (
                  r.clientId ===
                  item.clientId
                );

              }
            );


          if (!exists) {

            const product =
              findLocalProduct(
                item.barcode
              );


            records.unshift({

              recordId:
                item.clientId,

              clientId:
                item.clientId,

              timestamp:
                new Date(
                  item.createdAt
                ),

              date:
                item.date,

              location:
                item.location,

              employee:
                item.employee,

              barcode:
                item.barcode,

              productCode:
                product
                  ? product.productCode
                  : "",

              description:
                product
                  ? product.description
                  : "Pending",

              price:
                product
                  ? product.price
                  : 0,

              qty:
                item.qty,

              pending:
                true

            });

          }

        }
      );


    renderRecords();

    updateStats();


  } catch (err) {

    console.error(err);

    /*
     * Server unavailable হলে
     * local queue দিয়ে UI চালু থাকবে।
     */

    renderRecords();

    updateStats();

  }

}

/********************************************************

 ********************************************************/

async function stopScanner() {

  if (!scanner) {

    return;
  }


  try {

    await scanner.stop();

  } catch (e) {

    console.error(e);

  }


  try {

    scanner.clear();

  scanner = null;

  scannerRunning = false;


  document
    .getElementById(
      "reader"
    )
    .style.display =
    "none";


  document
    .getElementById(
      "scanButton"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "closeCameraButton"
    )
    .style.display =
    "none";


  hideProduct();

}


/********************************************************
 * CONNECTION STATUS
 ********************************************************/

function updateConnectionStatus() {

  const online =
    navigator.onLine;


  const dot =
    document.getElementById(
      "statusDot"
    );


  const text =
    document.getElementById(
      "statusText"
    );


  if (online) {

    dot.classList.remove(
      "offline"
    );

    text.textContent =
      "Online";

  } else {

    dot.classList.add(
      "offline"
    );

    text.textContent =
      "Offline - data will sync later";

  }

}


/********************************************************
 * AUTO SYNC
 ********************************************************/

function startAutoSync() {

  window.addEventListener(
    "online",
    function() {

      updateConnectionStatus();

      showToast(
        "Internet connected - syncing..."
      );

      flushQueue();

    }
  );


  window.addEventListener(
    "offline",
    function() {

      updateConnectionStatus();

      showToast(
        "Offline mode"
      );

    }
  );

}


/********************************************************
 * LOADING
 ********************************************************/

function showLoading(
  show
) {

  document
    .getElementById(
      "loading"
    )
    .style.display =
    show
      ? "flex"
      : "none";

}


/********************************************************
 * TOAST
 ********************************************************/

let toastTimer;


function showToast(
  message
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function() {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


/********************************************************
 * FORMAT TIME
 ********************************************************/

function formatTime(
  value
) {

  try {

    const date =
      new Date(
        value
      );


    if (
      isNaN(
        date.getTime()
      )
    ) {

      return "";

    }


    return date.toLocaleTimeString(
      [],
      {
        hour:
          "2-digit",

        minute:
          "2-digit"
      }
    );

  } catch (e) {

    return "";

  }

}


/********************************************************
 * HTML ESCAPE
 ********************************************************/

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/********************************************************
 * JS ESCAPE
 ********************************************************/

function escapeJs(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    )
    .replace(
      /"/g,
      '\\"'
    )
    .replace(
      /\n/g,
      "\\n"
    )
    .replace(
      /\r/g,
      "\\r"
    );

}


/********************************************************
 * GLOBAL DATE CHANGE
 ********************************************************/

document
  .getElementById(
    "dateInput"
  )
  .addEventListener(
    "change",
    function() {

      localStorage.setItem(
        STORAGE.date,
        this.value
      );

    }
  );

  )

      if (

      ) {

      }

    }
  );
